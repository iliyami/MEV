version: "3.8"
services:
  validator-setup:
    image: bash:5.2
    container_name: bs-setup
    command: ["bash","-lc","mkdir -p /data/logs && sleep 3600"]
    volumes:
      - ../../target/release:/opt/bs:ro
      - ../../benchmark/logs:/data/logs
  validator-0:
    image: alpine:3.19
    container_name: bs-0
    environment:
      - ATTACK_MODE=sluggish
      - ATTACKER_RATIO=0.33
      - VICTIM_RATIO=0.23
      - SLUGGISH_TIMEOUT_MULTIPLIER=2.0
      - RUST_LOG=info
    command: ["/bin/sh","-lc","/opt/bs/sui-node --help 2>&1 | head -5 && echo 'sui-node started' && sleep 90"]
    volumes:
      - ../../target/release:/opt/bs:ro
      - ../../benchmark/logs:/data/logs
  validator-1:
