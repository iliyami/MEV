experiment:
  name: "mysticeti_simple_campaign"
  description: "Mysticeti simple 13-node MEV campaign"

protocol:
  name: "mysticeti"
  path: "mysticeti"
  package_name: "mysticeti-core"
  use_scripts: false

docker:
  tag: "mev-mysticeti:latest"
  cpus: "8.0"
  memory: "16g"

test:
  test_name: "test_fissure_attack_asr_13_nodes"
  REPETITIONS: 5

environment:
  NUM_NODES: "13"
  DURATION: "30"
  ATTACK_MODE: "fissure"
  ATTACKER_RATIO: "0.307"
  VICTIM_RATIO: "0.231"
  SLUGGISH_TIMEOUT_MULTIPLIER: "2.0"
  NUMBER_OF_LEADERS: "1"
  LEADER_TIMEOUT_MS: "2000"
  WAVE_LENGTH: "3"
  RUST_LOG: "info"

output:
  expected_asr: 50.0
  tolerance_percent: 100.0
