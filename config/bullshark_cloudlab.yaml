experiment:
  name: "bullshark_cloudlab_scaling"
  description: "Scalable Bullshark Fissure Attack Test (16 Nodes)"

protocol:
  name: "bullshark"
  path: "bullshark"

docker:
  tag: "mev-bullshark:latest"
  cpus: "4.0"
  memory: "8g"

test:
  test_name: "test_fissure_attack_asr_dynamic"

environment:
  ATTACK_MODE: "fissure"
  NUM_NODES: "16"
  ATTACKER_RATIO: "0.3125" # 5/16
  VICTIM_RATIO: "0.25"     # 4/16

output:
  expected_asr: 90.0
  tolerance_percent: 10.0
