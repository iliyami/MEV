experiment:
  name: "alephbft_performance"
  description: "AlephBFT MEV Attack Simulation Suite"

protocol:
  name: "alephbft"
  path: "alephbft"

docker:
  tag: "mev-alephbft:latest"
  cpus: "32.0"
  memory: "80g"

test:
  REPETITIONS: 5

scaling:
  network_sizes: [13, 25, 50, 100]
  attacker_ratios: [0.308]
  victim_ratios: [0.231]
  latencies: [0, 50, 150, 300]
  jitters: [0, 10, 30, 50]

attack:
  modes: ["fissure", "sluggish", "speculative"]
  durations: [30]

environment:
  NUM_NODES: "13"
  DURATION: "30"
  ATTACK_MODE: "fissure"
  ATTACKER_RATIO: "0.308"
  VICTIM_RATIO: "0.231"
  SPECULATIVE_P_MAX: "50"
  SLUGGISH_PROCESSING_DELAY_MS: "11"
  EXCLUSION_PROBABILITY: "0.95"
  # ALEPH RESEARCH PARAMETERS
  ALEPH_ELECTION_LOOKAHEAD: "3"      # Rounds ahead for election (Default: 3)
  ALEPH_COORD_REQUEST_DELAY_MS: "200" # Base delay for pulling missing units (Default: 200)
  ALEPH_HASH_SORT_SEED: "0"          # Seed for candidate leader randomization (0 = Deterministic)

output:
